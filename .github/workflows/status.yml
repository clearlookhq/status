# Checks Clearlook every 5 minutes from GitHub's servers and publishes the status page to Cloudflare
# Pages (status.clearlook.dev), so the page stays up when Clearlook's own server is down.
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit on the account only), CLOUDFLARE_ACCOUNT_ID.
name: status
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['incidents/**']
permissions:
  contents: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: node scripts/build.mjs
      - name: Keep the results
        run: |
          git config user.name "clearlook-status"
          git config user.email "status@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "checks $(date -u +%FT%TZ)" && git push
      - name: Publish
        run: npx -y wrangler@4.45.0 pages deploy dist --project-name clearlook-status --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
